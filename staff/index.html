<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>手在比薩員工資訊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--bg:#f3ece0;--surface:#fffdf8;--ink:#2a2118;--muted:#6f6254;--line:#dccdb6;--basil:#2f8a4e;--basil-soft:#e2f2e7;--tomato:#d23b2a;--tomato-soft:#fbe7e3;--amber:#b7791f;--amber-soft:#fbf0dc;
--f-pixel:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:960px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:#2a2118;color:#f3e6c8;border-radius:8px;padding:10px 14px}
.top .date{font-family:var(--f-pixel);font-size:22px;letter-spacing:.04em}
.banner{position:relative;width:100%;aspect-ratio:1024/338;border-radius:6px;overflow:hidden;background:#222;border:3px solid #2a2118}
.banner>img.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.board{position:absolute;left:52.6%;top:18%;width:23.4%;height:43%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-pixel);color:#2a1a0c;text-align:center;line-height:1.25;padding:4px}
.board .b1{font-size:clamp(10px,2.6vw,16px)}
.board .b2{font-size:clamp(13px,3.8vw,24px);font-weight:700}
.mascot{position:absolute;left:40%;bottom:1%;height:66%;transform:translateX(-50%);image-rendering:pixelated}
.chi{position:absolute;bottom:2%;left:60%;height:auto;transform:translateX(-50%);pointer-events:none;z-index:2}
.chi.flip{transform:translateX(-50%) scaleX(-1)}
.bubble{position:absolute;transform:translateX(-50%);z-index:3;background:#fffdf8;border:2px solid #2a1a0c;padding:2px 8px;font-family:var(--f-pixel);font-size:clamp(9px,2.2vw,15px);color:#2a1a0c;white-space:nowrap;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:#2a1a0c}
.cards{display:flex;flex-direction:column;gap:14px}
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.days.one{grid-template-columns:minmax(0,1fr)!important}
.card.tmr{border-style:dashed;background:#fbf7ef;box-shadow:none}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{flex:1 1 0;min-width:140px;display:block;text-align:center;font-family:var(--f-pixel);font-size:18px;color:var(--ink);text-decoration:none;background:var(--amber-soft);border:2px solid #2a2118;border-radius:4px;padding:10px 12px;overflow-wrap:anywhere}
.card{background:var(--surface);border:2px solid #2a2118;border-radius:6px;padding:14px 16px;box-shadow:3px 3px 0 rgba(42,33,24,.25)}
.card h2{margin:0 0 8px;font-family:var(--f-pixel);font-size:19px;font-weight:400;letter-spacing:.05em}
.item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item img{height:40px;width:auto;image-rendering:pixelated;flex:none}
.item .t{font-size:20px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:14px;font-weight:700;padding:1px 10px;border-radius:999px;white-space:nowrap}
.tag.last{background:var(--tomato-soft);color:var(--tomato)}
.tag.later{background:var(--amber-soft);color:var(--amber)}
.tag.past{background:#ece6db;color:var(--muted)}
.empty{color:var(--muted);padding:6px 0;font-size:17px}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.dl .d{font-family:var(--f-pixel);font-size:16px;color:var(--muted)}
.dl .n{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.dl .past{opacity:.5;text-decoration:line-through}
.cloth-row{display:flex;align-items:center;gap:14px;padding:6px 0}
.cloth-row img{height:56px;image-rendering:pixelated}
.cloth-row .verb{font-family:var(--f-pixel);font-size:34px;line-height:1}
.cloth-row .verb.keep{color:var(--basil)}.cloth-row .verb.toss{color:var(--tomato)}.cloth-row .verb.unknown{color:var(--amber);font-size:22px}
.cloth-row .sub{color:var(--muted);font-size:15px}
.alert{border:2px solid var(--tomato);background:var(--tomato-soft);color:#7a1d12;border-radius:6px;padding:12px 14px}
.alert b{display:block;font-size:19px}
.alert small{display:block;margin-top:4px;font-size:13px;overflow-wrap:anywhere}
.warn{border:2px dashed var(--amber);background:var(--amber-soft);color:#6b4710;border-radius:6px;padding:10px 14px;font-size:14px}
.warn ul{margin:4px 0 0;padding-left:1.2em}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-align:center}
.foot button{font:inherit;font-size:15px;padding:6px 18px;border:2px solid #2a2118;background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer}
.foot button[disabled]{opacity:.5}
.testbar{background:#b7791f;color:#fff;text-align:center;font-weight:700;padding:4px;border-radius:4px}
[hidden]{display:none!important}
@media(min-width:700px){.item .t{font-size:22px}.days{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="testbar" id="testbar" hidden>測試版：連到測試用的假資料，不是正式平台</div>
  <div class="top"><span class="date" id="date"></span></div>
  <div class="alert" id="err" hidden><b>讀不到資料，請看白板</b><small id="errMsg"></small></div>
  <div class="banner"><img class="bg" id="bgImg" alt=""><div class="board"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div><img class="chi" id="chi" alt=""><div class="bubble" id="bubble" hidden>凹嗚嗚嗚嗚</div></div>
  <div class="warn" id="warn" hidden></div>
  <div class="cards" id="cards">
    <div class="days">
      <section class="card"><h2>今天要做</h2><div id="today"></div></section>
      <section class="card tmr" id="tmrCard" hidden><h2 id="tmrTitle">明天</h2><div id="tomorrow"></div></section>
    </div>
    <section class="card"><h2>本週期限</h2><div class="dl" id="week"></div></section>
    <section class="card" id="linkCard" hidden><h2>連結</h2><div class="links" id="links"></div></section>
  </div>
  <div class="foot"><span id="foot"></span><button id="reload" type="button">重新整理</button></div>
</div>


<script>
// 這三行是正式版與測試版唯一不同的地方
var API_URL = 'https://script.google.com/macros/s/AKfycbzLsrdLVAhr-rYpNsY28yr5t2-tkp7WyjBqzLfQh98dK8LtLzvzWWYYei8vevoPRn8g_w/exec';
var TEST_MODE = false;
var ART = {"banner": "art/banner.webp", "icon_叫貨": "art/icon_order.png", "icon_備料": "art/icon_prep.png", "icon_布品": "art/icon_cloth.png", "chi_walk1": "art/chi_walk1.webp", "chi_walk2": "art/chi_walk2.webp", "chi_howl1": "art/chi_howl1.webp", "chi_howl2": "art/chi_howl2.webp"};
var MODEL = null;
// 和 Google 那邊一樣的網址規則，網頁再擋一次
var LINK_RULES = {
  '公告資料夾': /^https:\/\/drive\.google\.com\/drive\/folders\/[A-Za-z0-9_-]+\/?(\?[A-Za-z0-9=&_.-]*)?$/,
  '員工手冊': /^https:\/\/(docs\.google\.com\/document\/d\/[A-Za-z0-9_-]+|drive\.google\.com\/file\/d\/[A-Za-z0-9_-]+)(\/(edit|view|preview))?\/?(\?[A-Za-z0-9=&_.-]*)?$/
};
var WEEK_LABEL = {past: '已過', today: '今天'};

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function render(m) {
  document.getElementById('date').textContent = m.dateText;
  document.getElementById('bgImg').src = ART.banner;
  document.getElementById('b1').textContent = m.boardLine1;
  document.getElementById('b2').textContent = m.boardLine2;
  document.getElementById('foot').textContent = '資料讀取時間 ' + m.readAt + '　打開或按「重新整理」才會更新';

  var err = document.getElementById('err'), cards = document.getElementById('cards'), warn = document.getElementById('warn');
  if (!m.ok) {
    err.hidden = false; cards.hidden = true; warn.hidden = true;
    document.getElementById('errMsg').textContent = m.message || '';
    return;
  }
  err.hidden = true; cards.hidden = false;

  // 警告：哪幾列試算表資料有問題
  clear(warn);
  var warns = m.warnings.slice();
  if (!Array.isArray(m.tomorrowItems)) warns.push({line: 0, text: 'Google 那邊的程式還是舊版，「明天」和「連結」不會顯示'});
  if (warns.length) {
    warn.appendChild(el('div', null, '試算表有 ' + warns.length + ' 個問題，請告訴 Maurice：'));
    var ul = el('ul');
    warns.forEach(function (w) { ul.appendChild(el('li', null, (w.line ? '第 ' + w.line + ' 列：' : '') + w.text)); });
    warn.appendChild(ul);
    warn.hidden = false;
  } else { warn.hidden = true; }

  // 今天、明天兩張卡片（口布也在這裡出現：「口布先留著」「口布丟出」是星期日的事項）
  function dayList(box, items, emptyText, lastText) {
    clear(box);
    if (!items.length) box.appendChild(el('div', 'empty', emptyText));
    items.forEach(function (it) {
      var row = el('div', 'item');
      var im = el('img'); im.alt = it.category; im.src = ART['icon_' + it.category]; row.appendChild(im);
      row.appendChild(el('div', 't', it.text));
      if (it.last) row.appendChild(el('span', 'tag last', lastText));
      box.appendChild(row);
    });
  }
  dayList(document.getElementById('today'), m.todayItems, '今天沒有事項', '最晚今天');
  var tmrCard = document.getElementById('tmrCard');
  if (Array.isArray(m.tomorrowItems)) {
    document.getElementById('tmrTitle').textContent = '明天（星期' + (m.tomorrowDayChar || '') + '）';
    dayList(document.getElementById('tomorrow'), m.tomorrowItems, '明天沒有事項', '最晚明天');
    tmrCard.hidden = false;
  } else { tmrCard.hidden = true; }
  document.querySelector('.days').classList.toggle('one', tmrCard.hidden);

  var W = document.getElementById('week'); clear(W);
  if (!m.deadlines.length) W.appendChild(el('div', 'empty', '本週沒有期限'));
  m.deadlines.forEach(function (d) {
    W.appendChild(el('span', 'd', '週' + d.dayChar + ' ' + d.dateText));
    W.appendChild(el('span', 'n' + (d.status === 'past' ? ' past' : ''), d.text));
    var label = d.status === 'future' ? '還有' + d.n + '天' : WEEK_LABEL[d.status];
    W.appendChild(el('span', 'tag ' + (d.status === 'past' ? 'past' : d.status === 'today' ? 'last' : 'later'), label));
  });

  // 最下面的連結：網址由 Google 試算表「連結」分頁給，網頁裡不寫網址
  var L = document.getElementById('links'); clear(L);
  var links = Array.isArray(m.links) ? m.links : [];
  links.forEach(function (k) {
    if (!k || typeof k.url !== 'string' || typeof k.name !== 'string') return;
    if (!LINK_RULES[k.name] || !LINK_RULES[k.name].test(k.url) || /\/u\/\d+\//.test(k.url)) return;
    var a = el('a', null, k.name); a.href = k.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    L.appendChild(a);
  });
  document.getElementById('linkCard').hidden = !L.firstChild;
}

// 台北今天的「11/23（一）」，只在連不上 Google 時用
function localDateText() {
  var d = new Date(Date.now() + 8 * 3600000);
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + '日一二三四五六'.charAt(d.getUTCDay()) + '）';
}
function renderLoading() {
  document.getElementById('date').textContent = localDateText();
  document.getElementById('bgImg').src = ART.banner;
  document.getElementById('b1').textContent = '讀取中';
  document.getElementById('b2').textContent = '請稍等';
  document.getElementById('cards').hidden = true;
  document.getElementById('foot').textContent = '正在讀取資料…';
}
// 向 Google 拿這週的資料（不帶任何 Google 帳號，所以多帳號手機也能開）
function fetchModel() {
  var url = API_URL + String.fromCharCode(63) + 'format=json&t=' + Date.now();
  var timer;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timeout = new Promise(function (_, reject) { timer = setTimeout(function () { if (ctrl) ctrl.abort(); var x = new Error('等太久沒有回應'); x.zh = true; reject(x); }, 15000); });
  var opts = {credentials: 'omit', cache: 'no-store'};
  if (ctrl) opts.signal = ctrl.signal;
  var req = fetch(url, opts).then(function (r) {
    if (!r.ok) { var x = new Error('Google 回應錯誤 ' + r.status); x.zh = true; throw x; }
    return r.json().catch(function () { var x = new Error('收到的資料格式不對'); x.zh = true; throw x; });
  }).then(function (m) {
    if (!m || typeof m.ok !== 'boolean') { var x = new Error('收到的資料格式不對'); x.zh = true; throw x; }
    return m;
  });
  return Promise.race([req, timeout]).finally(function () { clearTimeout(timer); });
}
function taipeiTime() {
  var d = new Date(Date.now() + 8 * 3600000);
  return ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2);
}
var LOAD_SEQ = 0; // 每讀一次加 1；晚回來的舊結果直接丟掉
function load(btn, byUser) {
  var mine = ++LOAD_SEQ;
  if (btn) { btn.disabled = true; btn.textContent = '讀取中…'; }
  function done() { if (btn) { btn.disabled = false; btn.textContent = '重新整理'; } }
  return fetchModel().then(function (m) { if (mine !== LOAD_SEQ) return; MODEL = m; render(m); done(); }, function (e) {
    if (mine !== LOAD_SEQ) return;
    if (MODEL && MODEL.ok && MODEL.dateText === localDateText()) {
      document.getElementById('foot').textContent = '重新整理失敗，請稍後再按一次';
    } else {
      // 沒有資料，或畫面上是前一天的資料：不能留著，改成紅框
      MODEL = null;
      render({ok: false, dateText: localDateText(), readAt: '--:--',
        message: '連不上資料（' + (e && e.zh ? e.message : '網路或 Google 沒回應') + '），請稍後按「重新整理」',
        warnings: [], todayItems: [], deadlines: [], cloth: [], pose: 'stand',
        boardLine1: '讀不到資料', boardLine2: '請看白板'});
      if (byUser) document.getElementById('foot').textContent = '重新整理失敗（' + taipeiTime() + '），請稍後再按一次';
    }
    done();
  });
}
document.getElementById('testbar').hidden = !TEST_MODE;
renderLoading();
load(document.getElementById('reload'), false);
// 從別頁按返回時，Safari 會直接拿出舊畫面，這時重新讀一次
window.addEventListener('pageshow', function (ev) { if (ev.persisted) load(document.getElementById('reload'), false); });

// 長毛吉娃娃：只走地板，每 10 秒停下來嚎叫 2.5 秒。出任何錯都只停掉吉娃娃，不影響上面的畫面。
function startChi() {
  try {
    var img = document.getElementById('chi'), bub = document.getElementById('bubble');
    if (!img || !ART.chi_walk1 || !ART.chi_walk2 || !ART.chi_howl1 || !ART.chi_howl2) return;
    var W_PCT = {walk1: 6.05, walk2: 5.96, howl1: 6.64, howl2: 6.54}; // 圖寬占橫幅寬的百分比
    var X_MIN = 52, X_MAX = 86, SPEED = 3.9, WALK_MS = 10000, HOWL_MS = 2500; // 走路範圍避開吉祥物（%）
    function show(name, x, dir, bob) {
      img.src = ART['chi_' + name]; img.style.width = W_PCT[name] + '%';
      img.style.left = x + '%'; img.style.bottom = (2 + bob) + '%';
      img.className = 'chi' + (dir < 0 ? ' flip' : '');
    }
    var x = 56, dir = 1, phaseStart = null, howling = false, last = null;
    show('walk1', x, dir, 0);
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function frame(t) {
      if (phaseStart === null) { phaseStart = t; last = t; }
      var dt = Math.min(t - last, 100) / 1000; last = t;
      var el = t - phaseStart;
      if (!howling) {
        x += dir * SPEED * dt;
        if (x > X_MAX) { x = X_MAX; dir = -1; } else if (x < X_MIN) { x = X_MIN; dir = 1; }
        show((Math.floor(t / 200) % 2) ? 'walk2' : 'walk1', x, dir, (Math.floor(t / 200) % 2) ? 0.6 : 0);
        if (el >= WALK_MS) { howling = true; phaseStart = t; }
      } else {
        show((Math.floor(el / 400) % 2) ? 'howl2' : 'howl1', x, dir, 0);
        bub.style.left = x + '%'; bub.style.bottom = '30%'; bub.hidden = false;
        if (el >= HOWL_MS) { howling = false; phaseStart = t; bub.hidden = true; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (e) { /* 吉娃娃壞了不影響其他內容 */ }
}
// 先把吉娃娃 4 張圖載好，換動作時才不會閃
var CHI_PRELOAD = ['chi_walk1', 'chi_walk2', 'chi_howl1', 'chi_howl2'].map(function (k) { var im = new Image(); im.src = ART[k]; return im; });
startChi();

document.getElementById('reload').addEventListener('click', function () {
  load(this, true);
});
</script>
</body>
</html>
