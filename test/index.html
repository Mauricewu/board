<style>
:root{--bg:#11151f;--card:#1a2030;--line:#2c3550;--ink:#e8ecf4;--muted:#8a93a8;--field:#242b3d;--gold:#ffe08a;--green:#4fbf73;--red:#ff7a5c;
--f-pixel:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 100px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:#000;border-radius:8px;padding:10px 14px}
.top .title{font-family:var(--f-pixel);font-size:21px;letter-spacing:.04em;color:var(--gold)}
.top .who{font-family:var(--f-pixel);font-size:15px;background:#2a2f3f;color:var(--ink);padding:2px 10px;border-radius:3px;overflow-wrap:anywhere}
.office{position:relative;width:100%;aspect-ratio:1200/670;border-radius:6px;overflow:hidden;background:#111;border:3px solid #000}
.office img{position:absolute;image-rendering:pixelated;display:block}
.office img.bg{inset:0;width:100%;height:100%}
.office img.fr{display:none}.office img.fr.on{display:block}
.office img.chiimg{transform:translateX(-50%);height:auto}.office img.chiimg.flip{transform:translateX(-50%) scaleX(-1)}
.office img.cheerimg.on{animation:hop .6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.bub{position:absolute;transform:translateX(-50%);z-index:4;background:#fffdf8;border:2px solid #111;padding:1px 8px;font-family:var(--f-pixel);font-size:clamp(10px,2.6vw,16px);color:#111;white-space:nowrap;pointer-events:none;display:none;line-height:1.4}
.bub.on{display:block}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:#111}
.bub.alert{background:#fff0c2;color:#c0391b;font-weight:700;font-size:clamp(14px,3.6vw,22px);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bub.alert,.office img.cheerimg.on{animation:none}}
.plate{position:absolute;bottom:3%;width:30%;text-align:center;font-family:var(--f-pixel);color:#f6d77a;font-size:clamp(12px,3vw,20px)}
.sechead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 2px 0}
.sechead h2{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:19px;letter-spacing:.05em;color:var(--gold)}
.muted{color:var(--muted)}
.big{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.mail{font-family:ui-monospace,Menlo,monospace;font-size:16px;background:var(--field);padding:2px 8px;border-radius:4px;overflow-wrap:anywhere}
.box{border-radius:10px;padding:12px 14px;border:2px solid}
.box.warn{background:#3b3216;border-color:#8a6d1f;color:#ffe9a8}
.box.err{background:#4a2420;border-color:#a8452f;color:#ffc9bb}
.box h3{margin:0 0 6px;font-size:17px}
.box ul{margin:4px 0 0;padding-left:20px}
.detail{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
button{font:15px var(--f-pixel);background:var(--gold);color:#000;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button.ghost{background:var(--field);color:var(--ink)}
button.sm{font-size:13px;padding:4px 10px}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.gone{opacity:.7}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.who2{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.own{font-size:14px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;background:#3a4258;color:var(--ink)}
.own.r-in{background:#ffa552;color:#2a1400}.own.r-out{background:#6fb0ff;color:#06182e}.own.r-mk{background:#c39bff;color:#1d0b3a}
.ttl{font-weight:700;font-size:18px;margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;background:#2a2f3f;color:#b8bfd0}
.pill.s2{background:#1e3a2a;color:#5fd47f}.pill.s3{background:#143a40;color:#6fd8e8}.pill.s4{background:#4a2420;color:var(--red)}
.pill.red{background:#4a2420;color:var(--red)}.pill.yel{background:#3b3216;color:var(--gold)}
.seg{display:flex;gap:3px;background:var(--field);border-radius:5px;padding:4px;margin-top:12px}
.seg i{flex:1;height:16px;background:#2f3850;border-radius:2px}
.seg i.on{background:var(--green)}
.seg i.next{outline:2px solid var(--gold);outline-offset:-2px}
.seg.all i{background:#ffd54a}
.seg i.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scaleY(.4)}50%{transform:scaleY(1.7)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.seg i.pop{animation:none}}
.cap{margin-top:8px;color:var(--muted);font-size:13px}.cap b{color:var(--ink)}
.ms{margin-top:8px}
.ms .m{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.cb{width:26px;height:26px;border:2px solid #667;border-radius:5px;flex:none;padding:0;background:transparent;color:#000;font-size:16px;line-height:1}
.cb.on{background:var(--green);border-color:var(--green)}
.m .tx{flex:1;overflow-wrap:anywhere}
.m.done .tx{color:#7b849a;text-decoration:line-through}
.m small{color:#6b748a;font-size:11px;text-align:right}
.cheer{border-radius:8px;padding:6px 10px;font-size:13px;margin-top:10px;background:#1e3a2a;color:#9be8b0}
.cheer.gold{background:#3b3216;color:var(--gold)}
.row{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
select,input,textarea{font:15px var(--f-body);background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.rep{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.rep p{margin:5px 0;overflow-wrap:anywhere}.rep b{color:#aab}
.rin{display:flex;gap:6px;margin-top:8px;align-items:flex-end}
.rin textarea{flex:1;min-height:42px;resize:vertical}
.form{background:#2a2616;border:2px dashed #7a6a2a;border-radius:12px;padding:12px}
.fl{display:block;margin:8px 0;font-size:13px;color:var(--muted)}
.fl input[type=text],.fl input:not([type]){display:block;width:100%;margin-top:3px}
.chk{display:inline-block;margin:4px 10px 0 0;color:var(--ink);font-size:14px}
.msrow{display:flex;gap:6px;align-items:center;margin:4px 0}.msrow span{width:34px;color:var(--muted);font-size:12px;text-align:right}.msrow input{flex:1}
.cardwarn{margin-top:8px;font-size:12px;color:#ffe9a8;background:#3b3216;border-radius:6px;padding:4px 8px}
details.done>summary{cursor:pointer;color:var(--muted);margin:6px 2px}
.cal{padding:6px 16px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .evd{flex:none;width:112px;font-family:var(--f-pixel);font-size:15px;color:var(--gold);line-height:1.4}
.ev .evt{flex:1;overflow-wrap:anywhere}
.ev .evt small{display:block;color:var(--muted);font-size:12px}
.ev.now{background:#262a1c;margin:0 -16px;padding:10px 16px}
@media (max-width:420px){.ev{flex-wrap:wrap}.ev .evd{width:100%}}
details.mt>summary{cursor:pointer;color:var(--gold);margin-top:10px}
.mtext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.7;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;max-height:65vh;overflow:auto}
.lnk{color:var(--gold)}
.ack{display:flex;align-items:center;gap:10px;margin-top:10px;background:#3b3216;border-radius:8px;padding:8px 10px;color:#ffe9a8;font-size:13px}
.ack button{font-size:16px;padding:8px 18px;flex:none}
.hint{font-size:13px;color:var(--muted);margin:-4px 2px 0}
.frow{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.frow:first-child{border-top:0}.frow .muted{font-size:13px}
.prog{padding:12px 14px}.prog h3{margin:0 0 6px;font-size:15px;color:var(--gold);font-weight:700}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.prow:first-of-type{border-top:0}.prow .pn{min-width:0}.prow .muted{font-size:13px}
details.others>summary{cursor:pointer;color:var(--gold);margin:6px 2px;font-size:15px}
#app.busy{pointer-events:none;opacity:.75}
#toast{position:fixed;left:10px;right:10px;bottom:10px;max-width:740px;margin:0 auto;padding:10px 14px;border-radius:10px;background:#000;color:var(--ink);border:2px solid var(--gold);font-size:14px;display:none;z-index:9}
#toast.err{border-color:var(--red);color:#ffc9bb;background:#2a1512}
#app.stale{pointer-events:none}
#app.stale #reload{pointer-events:auto}
.stalebar{border-color:var(--line)}
#saving{position:fixed;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#1e3a2a;color:#5fd47f;border:1px solid #5fd47f;font-size:13px;display:none;z-index:8}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<div id="saving"></div>
<script>
// 這三行由 build.py 在產生正式版與測試版時填入
var API_URL = 'https://script.google.com/macros/s/AKfycbyNFegumx38Y97kIiLtW_67ZRcYS8VXqmiH9eyTF3BPaneFv6tkdM5vlL_jOn3-OShH/exec';
var TEST_MODE = true;
var ART = {"neichang_cheer": "../art/neichang_cheer.png", "neichang_sit_sleep": "../art/neichang_sit_sleep.png", "neichang_sit_type1": "../art/neichang_sit_type1.png", "neichang_sit_type2": "../art/neichang_sit_type2.png", "neichang_stand": "../art/neichang_stand.png", "neichang_walk1": "../art/neichang_walk1.png", "neichang_walk2": "../art/neichang_walk2.png", "neichang_walk3": "../art/neichang_walk3.png", "office_bg": "../art/office_bg.webp", "waichang_cheer": "../art/waichang_cheer.png", "waichang_sit_sleep": "../art/waichang_sit_sleep.png", "waichang_sit_type1": "../art/waichang_sit_type1.png", "waichang_sit_type2": "../art/waichang_sit_type2.png", "waichang_stand": "../art/waichang_stand.png", "waichang_walk1": "../art/waichang_walk1.png", "waichang_walk2": "../art/waichang_walk2.png", "waichang_walk3": "../art/waichang_walk3.png", "chi_walk1": "../art/chi_walk1.webp", "chi_walk2": "../art/chi_walk2.webp", "chi_howl1": "../art/chi_howl1.webp", "chi_howl2": "../art/chi_howl2.webp", "neichang_sitf_type1": "../art/neichang_sitf_type1.png", "neichang_sitf_type2": "../art/neichang_sitf_type2.png", "neichang_sitf_sleep": "../art/neichang_sitf_sleep.png", "waichang_sitf_type1": "../art/waichang_sitf_type1.png", "waichang_sitf_type2": "../art/waichang_sitf_type2.png", "waichang_sitf_sleep": "../art/waichang_sitf_sleep.png", "waichang2_sitf_type1": "../art/waichang2_sitf_type1.png", "waichang2_sitf_type2": "../art/waichang2_sitf_type2.png", "waichang2_sitf_sleep": "../art/waichang2_sitf_sleep.png", "waichang2_cheer": "../art/waichang2_cheer.png", "waichang2_cry": "../art/waichang2_cry.png"};
var MODEL = { state: 'loading', readAt: '' };
var STATUSES = ['未開始', '進行中', '完成', '卡住'];
var MAX_MS = 15;
var CATS = ['包場', '活動', '保養', '公休', '其他'];
var CAT_PILL = { '包場': 'yel', '活動': 's2', '保養': 's3', '公休': 'red', '其他': '' };
var ui = { logged: false, evForm: false, openMeet: false, armed: null, form: null, showArchived: false, openDone: false, busy: false, cheer: {}, pop: null, timer: null };
var drafts = {};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escBr(s){return esc(s).replace(/\n/g,'<br>');}
function fmtD(s){var m=/^\d{4}-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[1])+'/'+(+m[2]):esc(s||'');}
function fmtT(s){var m=/^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(s||'');return m?(+m[1])+'/'+(+m[2])+' '+m[3]+':'+m[4]:esc(s||'');}
function $(id){return document.getElementById(id);}

/* ---------- 像素辦公室（里程碑 9）：兩位主管＋吉娃娃 ----------
   動作只由交辦資料決定：驚嘆號（坐著打字＋頭上「！」）＞打字＞歡呼＞趴睡；另有特殊動作每 30 秒一次（見 SPECIAL）。
   整段包在 try 裡，出錯只會停掉辦公室動畫，不影響交辦、行事曆、會議記錄。 */
var SEAT = {
  neichang: { name: '內場主管', left: 21.11, top: 33.28, w: 13.42, cx: 25, cheerArt: 'stand', cheerCx: 28.3, cheerW: 10.97, cheerTop: 43.1, spArt: 'cheer', spW: 18.7, spTop: 39, spHop: true, bubX: 26, bubTop: 24, first: 20000 },
  waichang: { name: '外場主管', art: 'waichang2', left: 66.584, top: 32.216, w: 15.571, cx: 73, cheerArt: 'cheer', cheerW: 13.105, cheerTop: 42.14, spArt: 'cry', spW: 15.995, spTop: 48.45, spBub: '凹嗚嗚嗚嗚', spBubBottom: 51.2, bubX: 74, bubTop: 24, first: 30000 }
};
var ROLE_SPRITE = { '內場主管': 'neichang', '外場主管': 'waichang' };
var CHI = { W: { walk1: 5.69, walk2: 5.6, howl1: 6.24, howl2: 6.15 }, X_MIN: 41, X_MAX: 59, BOTTOM: 12, SPEED: 4, WALK_MS: 10000, HOWL_MS: 2500, BUB_BOTTOM: 28 };
var OFFICE = { raf: 0, x: 50, dir: 1, g0: null, last: null };
/* 特殊動作（內場舉鍋子、外場哭「凹嗚嗚嗚嗚」、吉娃娃嚎叫）：各自每 30 秒一次、一次 2.5 秒，第一次分別在第 10、20、30 秒，錯開不重疊；趴睡的人不做。 */
var SPECIAL = { EVERY: 30000, MS: 2500, CHI_FIRST: 10000 };
function inSpecial(el,first){return el>=first&&(el-first)%SPECIAL.EVERY<SPECIAL.MS;}

function officeModel(m){
  var tasks=(m.data&&m.data.tasks)||[], res={neichang:null,waichang:null,chi:null};
  function judge(p){
    var mine=tasks.filter(function(t){return !t.archived&&t.owners.indexOf(p.name)>=0;});
    var open=mine.filter(function(t){return t.status!=='完成';});
    var alert=mine.some(function(t){return t.overdue||t.unreplied;});
    return {st:alert?'alert':(open.length?'type':(mine.length?'cheer':'sleep')), open:open.length};
  }
  (m.people||[]).forEach(function(p){
    var sp=ROLE_SPRITE[p.role];
    if(sp&&!res[sp])res[sp]=judge(p);
    else if(p.role==='行銷'&&!res.chi)res.chi=judge(p);
  });
  return res;
}
function chiText(c){
  if(!c)return '';
  if(c.st==='alert')return '！';
  if(c.st==='type')return '未完成 '+c.open+' 件';
  return c.st==='cheer'?'全部完成':'沒有交辦';
}
function office(m){
  var M=officeModel(m),lab=[];
  var h='<div class="office" id="office"><img class="bg" src="'+ART.office_bg+'" alt="">';
  ['neichang','waichang'].forEach(function(sp){
    var s=SEAT[sp],o=M[sp]||{st:'sleep'},cls=o.st==='alert'?'type':o.st;
    var first={type:'sitf_type1',sleep:'sitf_sleep',cheer:'cheer'}[cls],pre=s.art||sp,ccx=s.cheerCx||s.cx;
    lab.push(s.name+'：'+{alert:'有交辦待處理',type:'處理交辦中',cheer:'交辦全部完成',sleep:'目前沒有交辦'}[o.st]);
    h+='<div class="pc" data-sp="'+sp+'" data-st="'+o.st+'">';
    ['sitf_type1','sitf_type2','sitf_sleep'].forEach(function(k){
      h+='<img class="fr'+(k===first?' on':'')+'" data-f="'+k+'" src="'+ART[pre+'_'+k]+'" alt="" style="left:'+s.left+'%;top:'+s.top+'%;width:'+s.w+'%">';
    });
    h+='<img class="fr cheerimg'+(first==='cheer'?' on':'')+'" data-f="cheer" src="'+ART[pre+'_'+s.cheerArt]+'" alt="" style="left:'+(ccx-s.cheerW/2)+'%;top:'+s.cheerTop+'%;width:'+s.cheerW+'%">';
    h+='<img class="fr'+(s.spHop?' cheerimg':'')+'" data-f="sp" src="'+ART[pre+'_'+s.spArt]+'" alt="" style="left:'+(s.cx-s.spW/2)+'%;top:'+s.spTop+'%;width:'+s.spW+'%">';
    h+='<div class="bub alert'+(o.st==='alert'?' on':'')+'" data-bub="alert" style="left:'+s.bubX+'%;top:'+s.bubTop+'%">！</div>';
    if(s.spBub)h+='<div class="bub" data-bub="sp" style="left:'+s.cx+'%;bottom:'+s.spBubBottom+'%">'+s.spBub+'</div>';
    h+='</div>';
  });
  var c=M.chi,alertC=!!c&&c.st==='alert';
  lab.push('吉娃娃人柱力：'+(c?{alert:'有交辦待處理',type:'處理交辦中',cheer:'交辦全部完成',sleep:'目前沒有交辦'}[c.st]:'沒有資料'));
  h+='<div class="pc" data-sp="chi" data-st="'+(c?c.st:'none')+'" data-mode="walk">';
  ['walk1','walk2','howl1','howl2'].forEach(function(k){
    h+='<img class="fr chiimg'+(k==='walk1'?' on':'')+'" data-f="'+k+'" src="'+ART['chi_'+k]+'" alt="" style="left:'+OFFICE.x+'%;bottom:'+CHI.BOTTOM+'%;width:'+CHI.W[k]+'%">';
  });
  h+='<div class="bub chibub'+(c?' on':'')+(alertC?' alert':'')+'" data-bub="1" data-open="'+(c?c.open:0)+'" style="left:'+OFFICE.x+'%;bottom:'+CHI.BUB_BOTTOM+'%">'+esc(chiText(c))+'</div></div>';
  h+='<div class="plate" style="left:10%">內場主管</div><div class="plate" style="left:60%">外場主管</div>';
  return h.replace('class="office" id="office"','class="office" id="office" role="img" aria-label="'+esc(lab.join('；'))+'"')+'</div>';
}
function stopOffice(){if(OFFICE.raf){cancelAnimationFrame(OFFICE.raf);OFFICE.raf=0;}}
function startOffice(){
  stopOffice();
  try{
    var root=$('office');if(!root)return;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var pcs={};[].forEach.call(root.querySelectorAll('.pc'),function(e){pcs[e.getAttribute('data-sp')]=e;});
    function imgs(pc){var o={};[].forEach.call(pc.querySelectorAll('img.fr'),function(e){o[e.getAttribute('data-f')]=e;});return o;}
    var cur={};   // 各角色目前顯示的格子，沒變就不動 DOM
    function setFrame(id,pc,list,key){
      if(cur[id]===key)return;cur[id]=key;
      for(var k in list)list[k].classList[k===key?'add':'remove']('on');
    }
    var seat={};['neichang','waichang'].forEach(function(sp){if(pcs[sp])seat[sp]={pc:pcs[sp],list:imgs(pcs[sp]),st:pcs[sp].getAttribute('data-st'),ab:pcs[sp].querySelector('[data-bub="alert"]'),sb:pcs[sp].querySelector('[data-bub="sp"]')};});
    var chi=pcs.chi?{pc:pcs.chi,list:imgs(pcs.chi),st:pcs.chi.getAttribute('data-st'),bub:pcs.chi.querySelector('.chibub')}:null;
    function show(el,on){if(el&&el.classList.contains('on')!==on)el.classList[on?'add':'remove']('on');}
    function frame(t){
      try{
        if(OFFICE.g0===null){OFFICE.g0=t;OFFICE.last=t;}
        var dt=Math.min(t-OFFICE.last,100)/1000,el=t-OFFICE.g0;OFFICE.last=t;
        ['neichang','waichang'].forEach(function(sp,i){
          var s=seat[sp];if(!s)return;
          var spOn=s.st!=='sleep'&&inSpecial(el,SEAT[sp].first),key;
          if(spOn)key='sp';
          else if(s.st==='alert'||s.st==='type')key=(Math.floor((t+i*200)/400)%2)?'sitf_type2':'sitf_type1';
          else key=s.st==='cheer'?'cheer':'sitf_sleep';
          setFrame(sp,s.pc,s.list,key);
          show(s.ab,s.st==='alert'&&!spOn);show(s.sb,spOn);
          var mode=spOn?'sp':'base';if(s.pc.getAttribute('data-mode')!==mode)s.pc.setAttribute('data-mode',mode);
        });
        if(chi){
          var alert=chi.st==='alert',howl=inSpecial(el,SPECIAL.CHI_FIRST),key,bob=0,txt;
          if(howl){
            key=(Math.floor((el-SPECIAL.CHI_FIRST)/400)%2)?'howl2':'howl1';txt='凹嗚嗚嗚嗚';
          }else{
            OFFICE.x+=OFFICE.dir*CHI.SPEED*dt;
            if(OFFICE.x>CHI.X_MAX){OFFICE.x=CHI.X_MAX;OFFICE.dir=-1;}else if(OFFICE.x<CHI.X_MIN){OFFICE.x=CHI.X_MIN;OFFICE.dir=1;}
            var odd=Math.floor(t/200)%2;key=odd?'walk2':'walk1';bob=odd?0.6:0;txt=chi.st==='none'?'':chiText({st:chi.st,open:+chi.bub.getAttribute('data-open')||0});
          }
          setFrame('chi',chi.pc,chi.list,key);
          for(var k in chi.list){var im=chi.list[k];im.style.left=OFFICE.x+'%';im.style.bottom=(CHI.BOTTOM+bob)+'%';im.classList[OFFICE.dir<0?'add':'remove']('flip');}
          chi.bub.style.left=OFFICE.x+'%';chi.bub.classList[alert&&!howl?'add':'remove']('alert');
          if(chi.bub.getAttribute('data-txt')!==txt){chi.bub.setAttribute('data-txt',txt);chi.bub.textContent=txt;}
          var mode=howl?'howl':'walk';if(chi.pc.getAttribute('data-mode')!==mode)chi.pc.setAttribute('data-mode',mode);
        }
        OFFICE.raf=requestAnimationFrame(frame);
      }catch(e){OFFICE.raf=0;}   // 辦公室動畫壞了就停在那裡，其他內容照常
    }
    OFFICE.raf=requestAnimationFrame(frame);
  }catch(e){OFFICE.raf=0;}
}

/* ---------- 保留打到一半的字 ---------- */
function collect(){
  var els=$('app').querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){var e=els[i];drafts[e.getAttribute('data-k')]=(e.type==='checkbox')?(e.checked?'1':''):e.value;}
}
function restore(){
  var els=$('app').querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){var e=els[i],k=e.getAttribute('data-k');
    if(drafts[k]===undefined)continue;
    if(e.type==='checkbox')e.checked=!!drafts[k];else e.value=drafts[k];}
}
function clearDrafts(prefix){Object.keys(drafts).forEach(function(k){if(k.indexOf(prefix)===0)delete drafts[k];});}

/* ---------- 畫面 ---------- */
function isBoss(m){return m.me&&m.me.role==='老闆';}
function isMine(t,m){return !!(m.me&&t.owners.indexOf(m.me.name)>=0);}
function needAck(t,m){return !t.archived&&t.status!=='完成'&&isMine(t,m)&&!t.replies.some(function(r){return r.who===m.me.name;})&&!t.ms.some(function(x){return x.done&&x.by===m.me.name;});}

var OWN_CLS={'內場主管':'r-in','外場主管':'r-out','行銷':'r-mk'};
function ownersHtml(t,m){return t.owners.map(function(n){var r='';(m.people||[]).forEach(function(p){if(p.name===n)r=OWN_CLS[p.role]||'';});return '<span class="own'+(r?' '+r:'')+'">'+esc(n)+'</span>';}).join('');}
function taskHtml(t,m){
  var boss=isBoss(m),ro=t.archived,can=boss||isMine(t,m);   // can：能勾里程碑、改狀態（負責人與老闆）
  var total=t.ms.length,done=t.ms.filter(function(x){return x.done;}).length,all=total>0&&done===total;
  var next=null;t.ms.forEach(function(x){if(!next&&!x.done)next=x;});
  var h='<div class="card'+(ro?' gone':'')+'" data-card="'+esc(t.id)+'">';
  h+='<div class="head"><div><div class="who2">'+ownersHtml(t,m)+'<span>'+(t.start?fmtD(t.start):'')+(t.due?' ～ '+fmtD(t.due):'')+'</span></div>'+
     '<div class="ttl">'+esc(t.id)+'　'+esc(t.title)+'</div></div><div class="tags">';
  if(t.overdue)h+='<span class="pill red">逾期</span>';
  if(t.unreplied)h+='<span class="pill yel">未回覆</span>';
  if(ro)h+='<span class="pill">已封存</span>';
  var sc={'進行中':'s2','完成':'s3','卡住':'s4'}[t.status]||'';
  h+='<span class="pill '+sc+'">'+esc(t.status||'（未填）')+'</span></div></div>';
  if(needAck(t,m))h+='<div class="ack"><button data-act="ack" data-id="'+esc(t.id)+'">收到</button><span>按一下就等於回覆「收到」，頭上的「！」會消失</span></div>';

  if(total){
    h+='<div class="seg'+(all?' all':'')+'">';
    t.ms.forEach(function(x){
      var c=x.done?'on':(next&&x===next?'next':'');
      if(ui.pop&&ui.pop.id===t.id&&ui.pop.order===x.order)c+=' pop';
      h+='<i class="'+c+'"></i>';
    });
    h+='</div><div class="cap">里程碑 '+done+'／'+total+'　'+(all?'<b>全部完成</b>':'下一個：<b>「'+esc(next.text)+'」</b>')+'</div>';
  }else{
    h+='<div class="cap">還沒有里程碑</div>';
  }
  var fx=ui.cheer[t.id];
  if(fx)h+='<div class="cheer cheer-fx'+(fx.gold?' gold':'')+'">'+esc(fx.text)+'</div>';

  h+='<div class="ms">';
  t.ms.forEach(function(x){
    h+='<div class="m'+(x.done?' done':'')+'">'+
      (ro||!can?'<span class="cb'+(x.done?' on':'')+'" style="text-align:center">'+(x.done?'✓':'')+'</span>'
         :'<button class="cb'+(x.done?' on':'')+'" data-act="tick" data-id="'+esc(t.id)+'" data-order="'+x.order+'" data-to="'+(x.done?'0':'1')+'" aria-pressed="'+(x.done?'true':'false')+'" aria-label="'+esc(x.text)+'">'+(x.done?'✓':'')+'</button>')+
      '<span class="tx">'+esc(x.text)+'</span>'+(x.done?'<small>'+esc(x.by)+' '+fmtT(x.at)+'</small>':'')+'</div>';
  });
  h+='</div>';

  h+='<div class="row">狀態：';
  if(ro||!can){h+=esc(t.status||'（未填）');}
  else{
    h+='<select data-act="status" data-id="'+esc(t.id)+'">';
    if(STATUSES.indexOf(t.status)<0)h+='<option value="" selected>（未填）</option>';
    STATUSES.forEach(function(s){h+='<option'+(s===t.status?' selected':'')+'>'+s+'</option>';});
    h+='</select>';
  }
  if(boss){
    h+='<button class="ghost sm" data-act="edit-form" data-id="'+esc(t.id)+'">編輯</button>'+
       '<button class="ghost sm" data-act="archive" data-id="'+esc(t.id)+'" data-to="'+(ro?'0':'1')+'">'+(ro?'取消封存':(ui.armed===t.id?'再按一次確定封存':'封存'))+'</button>';
  }
  h+='</div>';
  if(t.problems.length)h+='<div class="cardwarn">這筆資料有問題，請告訴 Maurice：'+t.problems.map(esc).join('；')+'</div>';

  h+='<div class="rep">';
  if(!t.replies.length)h+='<p class="muted">還沒有回覆</p>';
  t.replies.forEach(function(r){h+='<p><b>'+esc(r.who)+' '+fmtT(r.time)+'</b>　'+escBr(r.text)+'</p>';});
  if(!ro)h+='<div class="rin"><textarea data-k="reply:'+esc(t.id)+'" maxlength="500" placeholder="寫回覆…"></textarea><button data-act="reply" data-id="'+esc(t.id)+'">送出</button></div>';
  h+='</div></div>';
  return h;
}

function wd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?'日一二三四五六'.charAt(new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()):'';}
function fmtDW(s){return fmtD(s)+'（'+wd(s)+'）';}

/* 大家的進度：每位內場主管、外場主管、行銷一行（不含老闆、不含封存與已完成） */
function daysBetween(a,b){var x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(a||''),y=/^(\d{4})-(\d{2})-(\d{2})$/.exec(b||'');if(!x||!y)return null;return Math.round((Date.UTC(+y[1],+y[2]-1,+y[3])-Date.UTC(+x[1],+x[2]-1,+x[3]))/86400000);}
function progHtml(m){
  var d=m.data,ps=(m.people||[]).filter(function(p){return OWN_CLS[p.role];});
  if(!ps.length)return '';
  var h='<div class="card prog"><h3>大家的進度</h3>';
  ps.forEach(function(p){
    var ts=d.tasks.filter(function(t){return !t.archived&&t.status!=='完成'&&t.owners.indexOf(p.name)>=0;});
    var tot=0,dn=0,od=0,near='';
    ts.forEach(function(t){tot+=t.ms.length;dn+=t.ms.filter(function(x){return x.done;}).length;if(t.overdue)od++;else if(t.due&&(!near||t.due<near))near=t.due;});
    h+='<div class="prow"><span class="own '+OWN_CLS[p.role]+'">'+esc(p.name)+'</span>';
    if(!ts.length){h+='<span class="muted">沒有未完成的交辦</span></div>';return;}
    h+='<span class="pn">'+ts.length+' 件進行中</span><span class="muted">關卡 '+dn+'／'+tot+'</span>';
    if(od)h+='<span class="pill red">逾期 '+od+' 件</span>';
    if(near){var n=daysBetween(d.today,near);h+='<span class="muted">最近期限 '+fmtD(near)+(n===null?'':n<0?'（已過期）':n===0?'（今天）':'（剩 '+n+' 天）')+'</span>';}
    h+='</div>';
  });
  return h+'</div>';
}
function evHtml(m){
  var d=m.data,h='<div class="sechead"><h2>店內行事曆</h2><div><button data-act="ev-new">＋ 新增行事曆</button></div></div>';
  if(ui.evForm)h+=evFormHtml();

    h+='<div class="card"><p class="muted" style="margin:0">未來 '+d.eventDays+' 天沒有行事曆項目。</p></div>';
  }else{

    d.events.forEach(function(e){
      var when=fmtDW(e.date)+(e.end?'<br>～'+fmtDW(e.end):'');
      var tag=e.now?'<span class="pill yel">'+(e.date===d.today?'今天':'進行中')+'</span> ':'';
      h+='<div class="ev'+(e.now?' now':'')+'"><div class="evd">'+when+'</div><div class="evt">'+tag+esc(e.title)+(e.by?'<small>'+esc(e.by)+' 新增</small>':'')+'</div>'+
         '<span class="pill '+(CAT_PILL[e.cat]||'')+'">'+esc(e.cat)+'</span></div>';

  return h;

function render(m,nocollect){
  stopOffice();
  if(!nocollect)collect();
  var y=window.scrollY;
  var h='';
  var who=m.state==='ok'?'你好，'+esc(m.me.name)+'（'+esc(m.me.role)+'）':'';
  h+='<div class="top"><div class="title">主管專案平台</div>'+(who?'<div class="who">'+who+'</div>':'')+'</div>';
  if(TEST_MODE)h+='<div class="box warn"><h3>測試版</h3><p>這一頁連到測試用的假資料，不是正式平台。</p></div>';
  if(ui.stale&&m.state==='ok')h+='<div class="box stalebar"><p class="muted" style="margin:0">'+(ui.staleErr?'連不上平台，下面是上次看到的內容（讀取時間 '+esc(m.readAt)+'）。請按最下面的「重新整理」再試一次。':'下面是上次看到的內容（讀取時間 '+esc(m.readAt)+'），正在讀最新資料，好了就能按。')+'</p></div>';

  if(m.state==='ok'){
    var boss=isBoss(m),d=m.data;
    if(boss)h+=office(m);
    if(boss&&(m.warnings||[]).length){
      h+='<div class="box warn"><h3>「人員」分頁有問題（只有老闆看得到）</h3><ul>'+
        m.warnings.map(function(w){return '<li>第 '+w.line+' 列：'+esc(w.text)+'</li>';}).join('')+'</ul></div>';
    }
    if(d.warnings.length){
      if(boss)h+='<div class="box warn"><h3>試算表裡有 '+d.warnings.length+' 個資料問題</h3><ul>'+
        d.warnings.map(function(w){return '<li>「'+esc(w.sheet)+'」第 '+w.line+' 列：'+esc(w.text)+'</li>';}).join('')+'</ul></div>';
      else h+='<div class="box warn"><h3>有 '+d.warnings.length+' 筆資料有問題</h3><p>請告訴 Maurice，他看得到是哪一列。</p></div>';
    }
    if(m.logOk===false){
      h+='<div class="box warn"><h3>這次沒有記到「操作紀錄」</h3><p>網頁可以看，但試算表寫不進去。之後送出交辦或回覆也會失敗，請截圖傳給 Maurice。</p><div class="detail">'+esc(m.logError)+'</div></div>';
    }
    h+='<div class="sechead"><h2>交辦事項</h2><div>';
    if(boss)h+='<label class="muted" style="font-size:13px"><input type="checkbox" data-act="show-archived"'+(ui.showArchived?' checked':'')+'> 顯示封存</label>　<button data-act="new-form">＋ 新增交辦</button>';
    h+='</div></div>';
    if(boss)h+=formHtml(m);
    var list=d.tasks.filter(function(t){return ui.showArchived||!t.archived;});
    var open=list.filter(function(t){return t.status!=='完成';}),fin=list.filter(function(t){return t.status==='完成';});
    h+=progHtml(m);
    if(!list.length)h+='<div class="card"><p class="muted" style="margin:0">還沒有交辦。'+(boss?'按右上角「新增交辦」建立第一筆。':'')+'</p></div>';
    if(boss){
      open.forEach(function(t){h+=taskHtml(t,m);});
    }else{
      var mine=open.filter(function(t){return isMine(t,m);}),others=open.filter(function(t){return !isMine(t,m);});
      if(list.length)h+='<p class="hint">你的未完成交辦 '+mine.length+' 件'+(mine.length?'，排在最上面':'')+'</p>';
      mine.forEach(function(t){h+=taskHtml(t,m);});
      if(list.length&&!mine.length)h+='<div class="card"><p class="muted" style="margin:0">你目前沒有未完成的交辦。</p></div>';
      h+=office(m);
      if(others.length){
        h+='<details class="others"'+(ui.openOthers?' open':'')+' ontoggle="ui.openOthers=this.open"><summary>其他人的交辦 '+others.length+' 件（點開看）</summary><div style="display:flex;flex-direction:column;gap:12px">'+
          others.map(function(t){return taskHtml(t,m);}).join('')+'</div></details>';
      }

    if(fin.length){
      h+='<details class="done"'+(ui.openDone?' open':'')+' ontoggle="ui.openDone=this.open"><summary>已完成 '+fin.length+' 件</summary><div style="display:flex;flex-direction:column;gap:12px">'+
        fin.map(function(t){return taskHtml(t,m);}).join('')+'</div></details>';
    }
    h+=evHtml(m);
    h+=meetingHtml(m);
    h+=foldersHtml(m);
  } else if(m.state==='invalid'){
    h+='<div class="box err"><h3>連結無效，請向 Maurice 索取</h3></div>';
  } else if(m.state==='loading'){
    h+='<div class="box"><p class="muted" style="margin:0">讀取中…</p></div>';
  } else if(m.state==='neterr'){
    h+='<div class="box err"><h3>連不上平台</h3><p>可能是網路不穩。請按下面的「重新整理」再試一次，還是不行請告訴 Maurice。</p><div class="detail">'+esc(m.detail||'')+'</div></div>';
  } else {
    h+='<div class="box err"><h3>讀不到資料，請告訴 Maurice</h3><p>試算表的分頁或欄位名稱可能被改到了。</p>'+screenshotHint()+
       '<div class="detail">'+esc(m.detail)+'</div></div>';

  if(m.state!=='invalid'&&m.state!=='loading')h+='<div class="foot"><span>'+(m.readAt?'讀取時間 '+esc(m.readAt):'')+'</span><button id="reload" data-act="reload">重新整理</button></div>';
  $('app').innerHTML=h;
  $('app').classList[ui.stale?'add':'remove']('stale');
  startOffice();
  restore();
  window.scrollTo(0,y);
  ui.pop=null;
  if(Object.keys(ui.cheer).length){
    clearTimeout(ui.timer);
    ui.timer=setTimeout(function(){
      ui.cheer={};
      var els=$('app').querySelectorAll('.cheer-fx');
      for(var i=0;i<els.length;i++)els[i].parentNode.removeChild(els[i]);
    },3000);
  }
}

/* ---------- 送出 ---------- */
function toast(text,isErr){var t=$('toast');t.textContent=text+(isErr?'（點一下這裡關閉）':'');t.className=isErr?'err':'';t.style.display='block';}
function untoast(){$('toast').style.display='none';}
$('toast').addEventListener('click',untoast);

/* ---------- 跟 Apps Script 傳話（用 fetch，不帶任何 Google 登入資料） ---------- */
var KEY=(new URLSearchParams(location.search).get('k')||'').trim();
function keyShapeOk(k){return k.length>=20&&k.length<=64&&/^[A-Za-z0-9]+$/.test(k);}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('超過 '+(ms/1000)+' 秒沒有回應'));},ms);})]);}
function parseJson(r){if(!r.ok)throw new Error('伺服器回應 '+r.status);return r.json();}
function apiGet(log){
  var u=API_URL+'?k='+encodeURIComponent(KEY)+(log?'&log=1':'');
  return withTimeout(fetch(u,{credentials:'omit'}),30000).then(parseJson);
}
function apiPost(fn,p){
  return withTimeout(fetch(API_URL,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:KEY,fn:fn,p:p})}),45000).then(parseJson);
}

var CACHE_KEY='board_cache_v1_'+(TEST_MODE?'test':'main');
function cacheSave(m){try{if(m&&m.state==='ok')localStorage.setItem(CACHE_KEY,JSON.stringify({k:KEY.slice(-8),m:m}));}catch(e){}}
function cacheLoad(){try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.k===KEY.slice(-8)&&c.m&&c.m.state==='ok')return c.m;}catch(e){}return null;}
function cacheClear(){try{localStorage.removeItem(CACHE_KEY);}catch(e){}}

// 讀取最新資料。還沒成功記過「開啟平台」之前，都帶 log=1；記過以後按「重新整理」就不再記
function loadModel(btn){
  apiGet(!ui.logged).then(function(m){
    if(m&&m.state==='ok'){ui.logged=true;cacheSave(m);}else if(m&&m.state==='invalid')cacheClear();
    ui.stale=false;ui.staleErr=null;LAST=JSON.stringify(m);
    untoast();MODEL=m;render(m);
  }).catch(function(e){
    if(ui.stale&&MODEL&&MODEL.state==='ok'){ui.staleErr=true;render(MODEL);return;}   // 顯示的是上次的內容：留著，提示連不上
    if(MODEL&&MODEL.state==='ok'){   // 已經有畫面：留著舊畫面，只把按鈕改成「失敗，再按一次」
      if(btn){btn.disabled=false;btn.textContent='重新整理失敗，再按一次';}
      return;
    }
    MODEL={state:'neterr',detail:e&&e.message?e.message:String(e)};render(MODEL);
  });
}

var Q=[];        // 排隊等存的動作，一次只送一筆，照按的順序
var LAST='';     // 最後一次從試算表回來的資料（存檔失敗時退回用）
function nowStr(){var d=new Date();function z(n){return (n<10?'0':'')+n;}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
function showSaving(){var e=$('saving');if(Q.length){e.textContent='存檔中…（'+Q.length+'）';e.style.display='block';}else e.style.display='none';}
function fixUnreplied(t){t.unreplied=!t.archived&&t.status!=='完成'&&t.owners.some(function(o){return !t.replies.some(function(r){return r.who===o;})&&!t.ms.some(function(x){return x.done&&x.by===o;});});}
function autoStatus(t){var d=t.ms.filter(function(x){return x.done;}).length,all=t.ms.length>0&&d===t.ms.length;
  if(all)t.status='完成';else if(t.status==='完成')t.status='進行中';else if(t.status==='未開始'&&d>0)t.status='進行中';}
function quick(fn,payload,apply){
  if(ui.busy||ui.stale)return;
  collect();
  var t=findTask(MODEL,payload.id);if(!t)return;
  apply(t);fixUnreplied(t);
  Q.push({fn:fn,p:payload});
  render(MODEL,true);showSaving();
  if(Q.length===1)runQ();
}
function runQ(){
  var job=Q[0];
  apiPost(job.fn,job.p).then(function(res){
    if(res&&res.ok&&res.model){
      Q.shift();LAST=JSON.stringify(res.model);
      if(Q.length){showSaving();runQ();}
      else{collect();MODEL=res.model;cacheSave(MODEL);render(MODEL,true);showSaving();}
    }else if(res&&res.invalid){
      Q=[];showSaving();cacheClear();MODEL={state:'invalid',readAt:''};render(MODEL);
    }else{
      qFail('沒有存成功：'+((res&&res.error)||'原因不明'));
    }
  }).catch(function(e){qFail('不確定有沒有存成功（'+(e&&e.message?e.message:e)+'）');});
}
function qFail(msg){
  var n=Q.length;Q=[];showSaving();
  toast(msg+'。畫面已換回試算表裡的樣子'+(n>1?'，後面 '+(n-1)+' 個動作也沒有存，請再按一次':'')+'。',true);
  if(LAST)MODEL=JSON.parse(LAST);
  ui.stale=true;ui.staleErr=null;render(MODEL);
  apiGet(false).then(function(m){if(m&&m.state==='ok'){MODEL=m;LAST=JSON.stringify(m);cacheSave(m);}ui.stale=false;render(MODEL);})
    .catch(function(){ui.stale=false;render(MODEL);});
}
window.addEventListener('beforeunload',function(e){if(Q.length){e.preventDefault();e.returnValue='';}});

function send(fn,payload,onOk){
  if(Q.length){toast('還在存檔，等右下角「存檔中」消失再送。',false);return;}
  ui.busy=true;ui.cheer={};$('app').classList.add('busy');toast('送出中…',false);
  apiPost(fn,payload).then(function(res){
    ui.busy=false;$('app').classList.remove('busy');untoast();
    if(res&&res.ok&&res.model){
      collect();MODEL=res.model;LAST=JSON.stringify(res.model);cacheSave(MODEL);if(onOk)onOk(res.model);render(res.model,true);   // 先收一次畫面上的字，再由 onOk 決定哪些要清掉，不讓舊字又被收回來
    }else if(res&&res.invalid){
      MODEL={state:'invalid',readAt:''};render(MODEL);
    }else{
      toast('沒有送出成功：'+((res&&res.error)||'原因不明')+'。請按「重新整理」確認有沒有存進去，再決定要不要重送。',true);
      render(MODEL);
    }
  }).catch(function(e){
    ui.busy=false;$('app').classList.remove('busy');
    toast('不確定有沒有送出成功（'+(e&&e.message?e.message:e)+'）。請先按「重新整理」，確認有沒有存進去，沒有再重送。',true);
    render(MODEL);
  });
}

function findTask(m,id){var r=null;((m.data&&m.data.tasks)||[]).forEach(function(t){if(t.id===id)r=t;});return r;}

function openNew(){
  clearDrafts('f:');
  ui.form={mode:'new',msCount:3};
  drafts['f:start']=MODEL.data.today;
  render(MODEL);
}
function openEdit(id){
  var t=findTask(MODEL,id);if(!t)return;
  clearDrafts('f:');
  ui.form={mode:'edit',id:id,orders:t.ms.map(function(x){return x.order;}),msCount:t.ms.length};
  drafts['f:title']=t.title;drafts['f:start']=t.start;drafts['f:due']=t.due;
  MODEL.people.forEach(function(p,i){drafts['f:own:'+i]=t.owners.indexOf(p.name)>=0?'1':'';});
  t.ms.forEach(function(x,i){drafts['f:ms:'+i]=x.text;});
  render(MODEL);
}
function openEv(){
  clearDrafts('e:');
  ui.evForm=true;
  drafts['e:date']=MODEL.data.today;
  render(MODEL);
}
function submitEv(){
  collect();
  send('addEvent',{date:drafts['e:date']||'',end:drafts['e:end']||'',title:drafts['e:title']||'',cat:drafts['e:cat']||''},
    function(){ui.evForm=false;clearDrafts('e:');});
}
function submitForm(){
  collect();
  var f=ui.form,owners=[];
  MODEL.people.forEach(function(p,i){if(drafts['f:own:'+i])owners.push(p.name);});
  var base={title:drafts['f:title']||'',owners:owners,start:drafts['f:start']||'',due:drafts['f:due']||''};
  if(f.mode==='new'){
    var ms=[];for(var i=0;i<f.msCount;i++)ms.push(drafts['f:ms:'+i]||'');
    base.milestones=ms;
    send('addTask',base,function(){ui.form=null;clearDrafts('f:');});
  }else{
    base.id=f.id;base.msTexts={};base.newMs=[];
    for(var j=0;j<f.msCount;j++){
      if(j<f.orders.length)base.msTexts[f.orders[j]]=drafts['f:ms:'+j]||'';
      else base.newMs.push(drafts['f:ms:'+j]||'');
    }
    send('editTask',base,function(){ui.form=null;clearDrafts('f:');});
  }
}

$('app').addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el||ui.busy)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act!=='archive'&&ui.armed){ui.armed=null;}
  if(act==='reload'&&Q.length){toast('還在存檔，等右下角「存檔中」消失再重新整理。',false);return;}
  if(act==='reload'){
    el.disabled=true;el.textContent='讀取中…';
    loadModel(el);
  }else if(act==='tick'){
    var order=parseInt(el.getAttribute('data-order'),10),want=el.getAttribute('data-to')==='1';
    el.classList[want?'add':'remove']('on');el.textContent=want?'✓':'';
    quick('setMilestone',{id:id,order:order,done:want},function(t){
      t.ms.forEach(function(x){if(x.order===order){x.done=want;x.by=want?MODEL.me.name:'';x.at=want?nowStr():'';}});
      autoStatus(t);
      if(!want)return;
      var d=t.ms.filter(function(x){return x.done;}).length;
      ui.pop={id:id,order:order};
      ui.cheer[id]=(d===t.ms.length)?{text:'全部完成！',gold:true}:{text:'又前進一格　'+d+'／'+t.ms.length,gold:false};
    });
  }else if(act==='ack'){
    quick('addReply',{id:id,text:'收到'},function(t){t.replies.push({who:MODEL.me.name,time:nowStr(),text:'收到'});});
  }else if(act==='reply'){
    collect();
    var text=(drafts['reply:'+id]||'').trim();
    if(!text){toast('回覆是空的',true);return;}
    quick('addReply',{id:id,text:text},function(t){delete drafts['reply:'+id];t.replies.push({who:MODEL.me.name,time:nowStr(),text:text});});
  }else if(act==='archive'){
    var toArch=el.getAttribute('data-to')==='1';
    if(toArch&&ui.armed!==id){ui.armed=id;render(MODEL);return;}   // 第一次按只是確認，再按一次才封存
    ui.armed=null;
    send('setArchived',{id:id,archived:toArch});
  }else if(act==='new-form'){openNew();}
  else if(act==='edit-form'){openEdit(id);}
  else if(act==='form-cancel'){ui.form=null;clearDrafts('f:');render(MODEL);}
  else if(act==='form-addms'){collect();if(ui.form.msCount<MAX_MS){ui.form.msCount++;render(MODEL);}}
  else if(act==='form-submit'){submitForm();}
  else if(act==='ev-new'){openEv();}
  else if(act==='ev-cancel'){ui.evForm=false;clearDrafts('e:');render(MODEL);}
  else if(act==='ev-submit'){submitEv();}
});
$('app').addEventListener('change',function(e){
  var el=e.target,act=el.getAttribute?el.getAttribute('data-act'):null;
  if(act==='status'){
    if(ui.busy)return;
    var sid=el.getAttribute('data-id'),sv=el.value;
    quick('setStatus',{id:sid,status:sv},function(t){var was=t.status;t.status=sv;if(!isBoss(MODEL)&&was!==sv)t.replies.push({who:MODEL.me.name,time:nowStr(),text:'（狀態改為：'+sv+'）'});});
  }else if(act==='show-archived'){ui.showArchived=el.checked;render(MODEL);}
});

if(!keyShapeOk(KEY)){MODEL={state:'invalid',readAt:''};render(MODEL);}   // 暗碼空白或格式不對：不用問伺服器
else{var cached=cacheLoad();if(cached){MODEL=cached;ui.stale=true;LAST=JSON.stringify(cached);}render(MODEL);loadModel(null);}
</script>
</body>
